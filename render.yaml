services:
  - type: web
    name: grimmory
    runtime: image
    image:
      url: ghcr.io/grimmory-tools/grimmory:latest
    plan: free
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: DATABASE_URL
        fromDatabase:
          name: grimmory-db
          property: connectionString

databases:
  - name: grimmory-db
    databaseName: grimmory
    user: grimmory_user
    plan: free
