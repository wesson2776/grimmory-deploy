services:
  - type: web
    name: grimmory
    runtime: image
    repo: https://github.com/你的用户名/你的仓库名
    image:
      url: ghcr.io/grimmory-tools/grimmory:latest
    envVars:
      - key: TZ
        value: Asia/Shanghai
    disk:
      name: grimmory-data
      mountPath: /data
      sizeGB: 10
    healthCheckPath: /

databases:
  - name: grimmory-db
    databaseName: grimmory
    user: postgres
