services:
  - type: web
    name: grimmory
    runtime: image
    image:
      url: ghcr.io/grimmory-tools/grimmory:latest
    plan: free
    envVars:
      - key: TZ
        value: Asia/Shanghai
    disk:
      name: grimmory-data
      mountPath: /data
      sizeGB: 1

databases:
  - name: grimmory-db
    databaseName: grimmory
    user: postgres
    plan: free
